<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>#1M Pending X Cards — 09.09.2026</title>
<link href="https://fonts.googleapis.com/css2?family=Righteous&family=Share+Tech+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#090014;
  --cyan:#00ffff;
  --pink:#ff00ff;
  --gold:#ffd700;
  --muted:#b7b2c0;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{
  width:auto;
  min-width:440px;
  background:#000;
  color:#fff;
  font-family:'Share Tech Mono',monospace;
}
body{
  display:flex;
  flex-direction:column;
  gap:28px;
  align-items:center;
  padding:28px;
}
.card{
  width:440px;
  min-height:520px;
  padding:28px 27px 26px;
  background:
    radial-gradient(circle at 55% 10%,rgba(255,0,255,.06),transparent 37%),
    linear-gradient(#090014,#070010);
  border:2px solid #7fffff;
  border-radius:20px;
  box-shadow:
    0 0 18px rgba(0,255,255,.56),
    inset 0 0 30px rgba(0,255,255,.035);
  overflow:hidden;
}
.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding-bottom:22px;
  border-bottom:1px solid rgba(255,0,255,.27);
}
.brand{
  font-family:'Righteous',cursive;
  font-size:27px;
  color:var(--pink);
  text-shadow:0 0 10px rgba(255,0,255,.85);
  white-space:nowrap;
}
.lock{
  border:1px solid #fff;
  border-radius:8px;
  padding:8px 12px;
  font-weight:700;
  font-size:13px;
  letter-spacing:3px;
  white-space:nowrap;
}
.legs{
  display:flex;
  flex-direction:column;
  gap:10px;
  margin-top:20px;
}
.leg{
  height:61px;
  border:1px dashed rgba(255,255,255,.15);
  border-radius:9px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 17px;
}
.blur-bar{
  height:15px;
  width:68%;
  border-radius:9px;
  background:linear-gradient(90deg,#2a2233,#50455b,#2d2435);
  filter:blur(4px);
  opacity:.72;
  box-shadow:0 0 7px rgba(255,255,255,.08);
}
.odd{
  font-weight:700;
  font-size:21px;
  color:var(--cyan);
  letter-spacing:2px;
  text-shadow:0 0 7px rgba(0,255,255,.55);
}
.footer{
  margin-top:22px;
  border:1px solid rgba(255,255,255,.12);
  background:rgba(0,0,0,.48);
  border-radius:10px;
  padding:17px 15px;
  display:grid;
  grid-template-columns:1.15fr 1fr 1.05fr;
  gap:8px;
  align-items:end;
}
.metric{text-align:center}
.label{
  font-size:11px;
  letter-spacing:2px;
  color:#a59eab;
  margin-bottom:7px;
}
.value{
  font-family:'Righteous',cursive;
  font-size:22px;
  white-space:nowrap;
}
.total{
  color:var(--cyan);
  text-shadow:0 0 7px rgba(0,255,255,.5);
}
.pct{
  color:var(--gold);
  text-shadow:0 0 8px rgba(255,215,0,.5);
}
</style>
</head>
<body>

<div class="card">
  <div class="top">
    <div class="brand">#1M 1️⃣🖕🏻🤑</div>
    <div class="lock">DAY 11 · LOCKED</div>
  </div>

  <div class="legs">
    <div class="leg"><div class="blur-bar"></div><div class="odd">1.24</div></div>
    <div class="leg"><div class="blur-bar"></div><div class="odd">1.47</div></div>
    <div class="leg"><div class="blur-bar"></div><div class="odd">1.56</div></div>
    <div class="leg"><div class="blur-bar"></div><div class="odd">1.23</div></div>
  </div>

  <div class="footer">
    <div class="metric">
      <div class="label">TOTAL ODDS</div>
      <div class="value total">@ 3.49</div>
    </div>
    <div class="metric">
      <div class="label">STAKE</div>
      <div class="value">134.24</div>
    </div>
    <div class="metric">
      <div class="label">BANKROLL %</div>
      <div class="value pct">1.0%</div>
    </div>
  </div>
</div>

<div class="card">
  <div class="top">
    <div class="brand">#1M 1️⃣🖕🏻🤑</div>
    <div class="lock">DAY 11 · LOCKED</div>
  </div>

  <div class="legs">
    <div class="leg"><div class="blur-bar"></div><div class="odd">1.09</div></div>
    <div class="leg"><div class="blur-bar"></div><div class="odd">1.19</div></div>
    <div class="leg"><div class="blur-bar"></div><div class="odd">1.56</div></div>
  </div>

  <div class="footer">
    <div class="metric">
      <div class="label">TOTAL ODDS</div>
      <div class="value total">@ 2.02</div>
    </div>
    <div class="metric">
      <div class="label">STAKE</div>
      <div class="value">671.20</div>
    </div>
    <div class="metric">
      <div class="label">BANKROLL %</div>
      <div class="value pct">5.0%</div>
    </div>
  </div>
</div>

</body>
</html>
